name: mentat-core

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/mentat-core.yml
      - packages/mentat/**
      - .opencode/plugins/mentat.ts
      - .opencode/agent/mentat.md
      - .opencode/agent/mentat-cloud.md
  pull_request:
    paths:
      - .github/workflows/mentat-core.yml
      - packages/mentat/**
      - .opencode/plugins/mentat.ts
      - .opencode/agent/mentat.md
      - .opencode/agent/mentat-cloud.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: '@mentat/core tests'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: packages/mentat
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Run core tests
        run: bun test test/*.test.ts
